[project]
name = "job-match-hunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Willian-Girao", email = "williansoaresgirao@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.162.2",
    "matplotlib>=3.11.2",
    "openai>=3.26.1",
    "pandas>=3.1.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "streamlit>=1.67.0",
    "supabase>=2.32.0",
    "tiktoken>=0.14.0",
    "transformers>=5.22.2",
]

[project.scripts]
job-match-hunter = "job_match_hunter:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
